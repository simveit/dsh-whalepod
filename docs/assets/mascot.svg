  <path d="M6,350 C120,330 220,368 330,350 C440,332 540,366 634,346 L634,374 A40,40 0 0 1 594,414 L46,414 A40,40 0 0 1 6,374 Z" fill="#C9D9FF" opacity="0.7"/>
  <g fill="#FFFFFF" opacity="0.9">
