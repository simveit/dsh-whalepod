    <path d="M150,226 C146,246 142,266 138,282 C146,286 152,287 158,288 C156,268 156,246 158,228 Z" fill="#DDE6FF" stroke="none"/>
    <path d="M135,276 C150,284 230,284 245,276 L247,284 C230,293 150,293 133,284 Z" fill="#4D6BFE"/>
    <path d="M190,212 L190,286" stroke="#A9C1FF" stroke-width="2"/>
    <path d="M181,212 C180,222 179,230 178,238 M199,212 C200,222 201,230 202,238" fill="none" stroke-width="2"/>
    <circle cx="178" cy="241" r="3.4" fill="#4D6BFE" stroke-width="1.8"/>
    <circle cx="202" cy="241" r="3.4" fill="#4D6BFE" stroke-width="1.8"/>
    <!-- clipboard -->
