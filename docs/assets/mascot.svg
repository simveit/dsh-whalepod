      <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#FFFFFF"/>
      <rect x="-14" y="-10" width="28" height="6" rx="3" fill="#4D6BFE" stroke="none"/>
      <path d="M-8,2 H8 M-8,6 H3" stroke="#A9C1FF" stroke-width="2"/>
