    <path d="M156,90 C172,81 210,81 228,90 L222,96 L216,90 L209,97 L202,90 L195,97 L188,90 L181,97 L174,90 L167,97 L161,91 Z" fill="#B9CFFF" stroke="none" opacity="0.85"/>
    <path d="M176,112 C182,104 186,96 186,86 M212,110 C214,102 214,94 210,86 M150,128 C150,116 154,108 160,100" fill="none" stroke="#2A3F9A" stroke-width="1.6" opacity="0.6"/>
    <path d="M196,112 C200,120 200,128 198,134" fill="none" stroke="#2A3F9A" stroke-width="1.6" opacity="0.6"/>
