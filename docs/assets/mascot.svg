    <path d="M512,168 C460,166 384,176 318,192" stroke="#22A892" marker-end="url(#at)"/>
    <path d="M308,200 C380,240 444,282 500,298" stroke="#4D6BFE" marker-end="url(#ab)"/>
    <path d="M370,330 C340,318 318,286 304,222" stroke="#22A892" marker-end="url(#at)"/>
  </g>

