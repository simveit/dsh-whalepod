    <path d="M224,222 C242,214 256,204 268,198" fill="none" stroke="#FFFFFF" stroke-width="17"/>
    <path d="M261,192 L268,206" stroke="#4D6BFE" stroke-width="5"/>
    <g transform="translate(290,182) rotate(-14)">
      <rect x="-17" y="-13" width="34" height="26" rx="4" fill="#FFFFFF"/>
      <rect x="-17" y="-13" width="34" height="8" rx="3" fill="#4D6BFE" stroke="none"/>
      <path d="M-11,1 H11 M-11,6 H4" stroke="#A9C1FF" stroke-width="2"/>
    </g>
    <circle cx="277" cy="193" r="7.5" fill="#FFE6D8"/>

    <!-- face -->
    <path d="M128,150 C128,108 156,92 190,92 C224,92 252,108 252,150 C252,184 226,206 190,206 C154,206 128,184 128,150 Z" fill="#FFE6D8"/>
    <g clip-path="url(#faceClip)" stroke="none">
