    <circle cx="300" cy="60" r="3"/><circle cx="612" cy="380" r="3"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M330,96 l3,-9 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 z"/>
    <path d="M598,236 l2,-6 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 z"/>
    <path d="M70,200 l2,-6 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 z"/>
  </g>
