  <!-- eyes and expression -->
  <use href="#eye" transform="translate(162,163) scale(1.16,1.08)"/>
  <use href="#eye" transform="translate(218,163) scale(1.16,1.08)"/>
  <g fill="none" stroke="#23306E" stroke-linecap="round" stroke-linejoin="round">
    <path d="M147,153 Q158,139 180,146" stroke-width="5.5"/>
    <path d="M147,153 L141,151 M148,149 L143,144" stroke-width="2.6"/>
    <path d="M233,153 Q222,139 200,146" stroke-width="5.5"/>
    <path d="M233,153 L239,151 M232,149 L237,144" stroke-width="2.6"/>
    <path d="M157,183 Q163,184.5 169,183 M211,183 Q217,184.5 223,183" stroke-width="1.6"/>
  </g>
  <ellipse cx="146" cy="185" rx="15" ry="9" fill="url(#blush)"/>
  <ellipse cx="234" cy="185" rx="15" ry="9" fill="url(#blush)"/>
  <g stroke="#F07D98" stroke-width="1.4" stroke-linecap="round">
