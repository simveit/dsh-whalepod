  <path d="M182,186 Q190,200 198,186 Q190,189 182,186 Z" fill="#B83A58" stroke="#23306E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M185.5,193 Q190,191 194.5,193 Q190,197.5 185.5,193 Z" fill="#FF8FA6"/>
