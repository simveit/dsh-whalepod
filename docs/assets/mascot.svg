<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t">
  <title id="t">Whalepod mascot: a coordinator girl handing assignment cards to four little whale helpers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#DCE7FF"/>
    </linearGradient>
    <linearGradient id="hair" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="300">
      <stop offset="0" stop-color="#2D43B8"/>
      <stop offset="0.5" stop-color="#4F70EE"/>
      <stop offset="1" stop-color="#93B8FF"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18205E"/>
      <stop offset="0.45" stop-color="#3756DD"/>
      <stop offset="1" stop-color="#7FC0FF"/>
    </linearGradient>
    <radialGradient id="blush">
      <stop offset="0" stop-color="#FF8FAA" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF9DB4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip">
      <path d="M128,150 C128,108 156,92 190,92 C224,92 252,108 252,150 C252,184 226,206 190,206 C154,206 128,184 128,150 Z"/>
    </clipPath>
    <marker id="ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#22A892" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- eye, centred on 0,0 -->
    <g id="eye">
      <ellipse cx="0" cy="1" rx="13.5" ry="17" fill="#FFFFFF"/>
      <ellipse cx="0" cy="2" rx="12" ry="15.5" fill="url(#iris)"/>
      <ellipse cx="0" cy="11" rx="8" ry="4" fill="#A6DBFF" opacity="0.8"/>
      <ellipse cx="0" cy="0" rx="5.5" ry="7.5" fill="#121A4C"/>
      <ellipse cx="-4.5" cy="-6" rx="4.6" ry="5.6" fill="#FFFFFF"/>
      <circle cx="5" cy="9" r="2.3" fill="#FFFFFF"/>
      <circle cx="6" cy="-6" r="1.3" fill="#FFFFFF"/>
    </g>
    <!-- little whale helper, facing right, centred on 0,0 -->
    <g id="whale" stroke="#23306E" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-26,8 C-36,6 -42,-2 -44,-10 C-52,-12 -58,-20 -58,-28 C-50,-24 -46,-22 -42,-20 C-42,-28 -38,-34 -32,-38 C-32,-28 -34,-18 -30,-10 C-28,-4 -26,0 -22,2 Z" fill="#7FA0FF"/>
      <path d="M-30,2 C-30,-20 -12,-31 6,-31 C27,-31 37,-14 37,2 C37,18 22,26 2,26 C-18,26 -30,16 -30,2 Z" fill="#7FA0FF"/>
      <path d="M-24,10 Q4,30 34,8 Q31,24 2,25 Q-18,24 -24,10 Z" fill="#FFFFFF" stroke-width="2"/>
      <ellipse cx="14" cy="-6" rx="5" ry="6" fill="#23306E" stroke="none"/>
      <circle cx="12.4" cy="-8.4" r="2" fill="#FFFFFF" stroke="none"/>
      <circle cx="16" cy="-3" r="1" fill="#FFFFFF" stroke="none"/>
      <ellipse cx="25" cy="5" rx="5" ry="3" fill="url(#blush)" stroke="none"/>
      <path d="M17,6 Q21,12 25,6 Z" fill="#E5607A" stroke-width="1.6"/>
      <path d="M-10,-20 Q0,-26 10,-21" fill="none" stroke="#C2D4FF" stroke-width="4"/>
    </g>
  </defs>

