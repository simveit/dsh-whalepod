# Build the release tarball when a version tag (v0.1.0, ...) is pushed, and attach it to a GitHub release.
#
# Users then install without any build step:
#   dsh plugin --profile desktop add https://github.com/simveit/dsh-whalepod/releases/download/v0.1.0/dsh-whalepod-0.1.0.tgz
# The asset dsh-whalepod.tgz has no version in its name, so .../releases/latest/download/dsh-whalepod.tgz
# always names the newest release.
#
# Two jobs: `build` installs, checks and packs with a read-only token and uploads the files as an artifact;
# `release` holds the write token, checks out nothing, runs no project code, and only publishes that artifact.
#
# Untested: this workflow has not run on GitHub yet. See ci.yml for the toolchain notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      # typecheck, tests, build and a pack dry run
      - run: pnpm run check

      # prepack builds lib/ again, without the development fake data source.
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          pnpm pack --pack-destination dist
          cd dist
          test -f "dsh-whalepod-$VERSION.tgz"
          if tar -xzOf "dsh-whalepod-$VERSION.tgz" package/lib/client.js | grep -q -e coordinatorSource -e dco-fake; then
            echo "The packed client contains the development fake data source" >&2
            exit 1
          fi
          cp "dsh-whalepod-$VERSION.tgz" dsh-whalepod.tgz
          sha256sum ./*.tgz > SHA256SUMS

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "dsh plugin --profile desktop add https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/dsh-whalepod-$VERSION.tgz"
            echo '```'
            echo
            echo "Quit the desktop app before installing into its profile, then start it again. Use --profile web for dsh web."
          } >> dist/notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-whalepod $VERSION" \
            --notes-file dist/notes.md --verify-tag $prerelease
