# Bundle layer of Whalepod (package dsh-whalepod), the plugin behind the Coordinator. It mounts the host service. It
# declares no agent preset: coordinators and Executor Sessions run on the user's stock `standard` preset, so their
# Sessions keep working when the plugin is removed, and the preset picker of other Sessions shows nothing new. The
# host service adds the role prompts (prompts/*.md) and the coordinator and executor tools only to coordinator chats
# and tracked Leads, narrows each coordinator to its allow list at runtime (no shell, write, subagent, terminal or
# third-party tools unless listed in coordinatorExtraTools), and moves Sessions of earlier releases off the old
# `thread` and `coordinator` presets once. The web client half is declared in package.json (dsh.client).
#
# Auto mode: Executor Sessions run under the `auto` permission preset only when the user has switched on dsh's own
# optional bundle @deepseek-ai/dsh-experimental-auto-review (Plugins > Auto authorization review). This layer does
# not insert that bundle's row (0.1.0 did): dsh's in-app Uninstall refuses a bundle while another layer still runs
# one of the rows it inserts, so a shared `auto-review` row made Whalepod impossible to uninstall in the app whenever
# the user also had the bundle on. Without `auto`, Executor Sessions run in workspace-write (Ask me), never looser.
# When the plugin is unloaded (removed from a running app, or at quit) it first moves its Executor Sessions to
# workspace-write, because the auto-review bundle switches `auto` sessions to full access when it goes away; on its
# next load it puts back the mode each one was started in, when that mode is available.
#
# Host config: all keys are optional. Override the row `dsh-coordinator` in a profile patch (the row id keeps the
# name the plugin had before it became dsh-whalepod, so existing settings rows still match; give such a row no
# `name`, or `name: dsh-whalepod`, because the loader skips a row whose name differs from the entry's).
# The keys and their defaults are listed in README.md, section Configuration (coordinatorBase, maxRunningThreads,
# threadPermission, coordinatorExtraTools, the notice, wake, turn and peer limits, and the legacy threadsRoot).
- insert:
    - id: dsh-coordinator
      name: dsh-whalepod
